name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  steamrt:
    name: steamrt / static
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk:latest
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/../ccache
      RELOADABLE: "OFF"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ../ccache
          key: ccache-steamrt-${{ github.sha }}
          restore-keys: ccache-steamrt-

      - name: Build
        run: |
          ccache -z
          ./cmd/steamrt/build
          ccache -s

  web:
    name: web / static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/../ccache

    steps:
      - name: Install dependencies
        timeout-minutes: 8
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # cute_framework requires CMake 4.2; the runner ships 3.31. Brings Ninja too.
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.4.4
          ninjaVersion: latest

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.12
          actions-cache-folder: emsdk-cache

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ../ccache
          key: ccache-web-${{ github.sha }}
          restore-keys: ccache-web-

      - name: Build
        run: |
          ccache -z
          ./cmd/web/build
          ccache -s

  windows:
    name: windows / static
    # Visual Studio 2026, which cmd/win/prepare.bat generates for.
    runs-on: windows-2025
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # cute_framework requires CMake 4.2; the runner ships 3.31.
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.4.4

      # Through the submodule path: Git for Windows checks the `cmd` symlink out as a text file.
      - name: Build
        shell: cmd
        run: call deps\bgame\cmd\win\build.bat || exit /b 1
